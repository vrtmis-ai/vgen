# ---------------------------------------------------------------------------
#  Secret scanning, and the one value it is allowed to ignore.
#
#  This repository is public and the provider credentials it talks to cost
#  money, so the whole history is scanned on every pull request. The default
#  rule set does the work; this file only narrows it, and the narrowing is the
#  part worth reviewing — an allowlist is a hole in a security control, so it
#  should be the smallest shape that lets the build pass.
# ---------------------------------------------------------------------------

[extend]
useDefault = true

# ---------------------------------------------------------------------------
#  One fake key, by exact value, anchored.
#
#  apps/api/src/routes/adminCatalog.test.ts holds the test named "reports the
#  secret_ref name and whether it is set, never the value". It sets a fake
#  WaveSpeed key and then asserts the response body does NOT contain it, so the
#  string has to appear twice in that file for the test to assert anything.
#
#  It is tempting to scope this by path as well — allow the value only in that
#  file — and it does not work. A `paths` entry in an allowlist drops the file
#  from the scan entirely, for every rule, and `matchCondition = "AND"` does not
#  make the decision per-finding. Measured, not assumed: with a path entry
#  present, swapping this fixture for an unrelated live-looking key on the same
#  line produced no finding at all. Naming the file would therefore excuse every
#  future secret in a test file, which is a comfortable place to paste one.
#
#  So the hole is one literal string, repo-wide, anchored so it cannot be a
#  prefix of something longer. Anything else key-shaped, anywhere — that file
#  included — is still a finding.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "The fake WaveSpeed key the secret_ref test has to be able to name"
regexes = ['''^ws-live-abc123$''']

# ---------------------------------------------------------------------------
#  There is deliberately no allowlist for .next/.
#
#  Next's build output trips the entropy rule about twenty times — a generated
#  preview key in prerender-manifest.json, plus the compiled chunks. Excluding
#  the directory would quieten a local `gitleaks dir`, and would also put a
#  permanent blind spot in the history scan: anything ever committed under that
#  path would stop being looked at, for every rule, forever.
#
#  Not worth it, because the noise it removes is not in the scan that matters.
#  CI scans commits and .next/ is gitignored, so it never appears there. Scan
#  the same way locally and the noise is not there either:
#
#      docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
#        git /repo -c /repo/.gitleaks.toml --redact
# ---------------------------------------------------------------------------
