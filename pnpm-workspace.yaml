packages:
  - "."
  - "apps/*"
  - "packages/*"

# pnpm reads overrides from HERE, not from package.json. A top-level
# "overrides" block in package.json is npm's spelling and is silently ignored,
# which is how a nanoid pin sat in this repo resolving to a different version
# than it named. If a pin matters, it goes in this file and the lockfile proves
# it took.
overrides:
  # One copy of the smithy type definitions, shared by every AWS SDK package.
  #
  # @aws-sdk/client-s3 and @aws-sdk/s3-request-presigner release in lockstep but
  # do not upgrade their transitive @smithy/types in lockstep, so a routine bump
  # can leave two copies installed. Two copies means two structural identities
  # for the same class, and passing an S3Client built against one into a
  # presigner typed against the other fails with "Types have separate
  # declarations of a private property 'handlers'" -- which reads like a bug in
  # our code and is not.
  "@smithy/types": "^4.17.2"
  # @smithy/core is the one that actually carries the Client class, and its
  # private `handlers` field is what the compiler compares. Both are pinned
  # because pinning only the types left two copies of core and the identical
  # error.
  "@smithy/core": "^3.33.2"

  # Kept from package.json, where it never did anything. A floor rather than an
  # exact pin: the installed 3.3.18 already clears it, and an exact pin here
  # would be a downgrade dressed up as a security control.
  nanoid: "^3.3.17"

allowBuilds:
  esbuild: true
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.67.0"
  - "@typescript-eslint/parser@8.67.0"
  - "@typescript-eslint/project-service@8.67.0"
  - "@typescript-eslint/scope-manager@8.67.0"
  - "@typescript-eslint/tsconfig-utils@8.67.0"
  - "@typescript-eslint/type-utils@8.67.0"
  - "@typescript-eslint/types@8.67.0"
  - "@typescript-eslint/typescript-estree@8.67.0"
  - "@typescript-eslint/utils@8.67.0"
  - "@typescript-eslint/visitor-keys@8.67.0"
  - typescript-eslint@8.67.0
  - "@next/env@16.3.1"
  - "@next/swc-darwin-arm64@16.3.1"
  - "@next/swc-darwin-x64@16.3.1"
  - "@next/swc-linux-arm64-gnu@16.3.1"
  - "@next/swc-linux-arm64-musl@16.3.1"
  - "@next/swc-linux-x64-gnu@16.3.1"
  - "@next/swc-linux-x64-musl@16.3.1"
  - "@next/swc-win32-arm64-msvc@16.3.1"
  - "@next/swc-win32-x64-msvc@16.3.1"
  - next@16.3.1
