services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vgen
      POSTGRES_USER: vgen
      POSTGRES_PASSWORD: vgen-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vgen -d vgen"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vgen-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vgen-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vgen-local
      MINIO_ROOT_PASSWORD: vgen-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vgen-minio:/data

volumes:
  vgen-postgres:
  vgen-redis:
  vgen-minio:
