name: CI

# main is a shared branch now, so it gets checked by something other than the
# person pushing to it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN, which is otherwise whatever the repository
# default happens to be — and that default is write on repositories created
# before GitHub changed it. Nothing here writes: every job checks the code out,
# runs a check and uploads an artifact. `codeql.yml` sets its own, wider, per
# job, because publishing to the Security tab genuinely needs one write.
#
# This is also the setting that decides what a pull request from a fork can
# reach. The trigger above is `pull_request`, not `pull_request_target`, so a
# fork's code already runs without secrets; pinning the token to read means a
# workflow change arriving in a PR cannot quietly grant itself more.
permissions:
  contents: read

concurrency:
  # A new push to the same branch cancels the run it superseded. The last commit
  # is the only one whose result anybody acts on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck, lint, format, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm before setup-node, not after: `cache: pnpm` resolves the store path
      # by running pnpm, so it has to exist first. No version is pinned here on
      # purpose — the action reads `packageManager` from package.json, which is
      # what keeps CI and the lockfile from drifting apart.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile is the point: it fails rather than quietly resolving
      # something the lockfile does not describe.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      # Three audits in one command, and all of them offline now. Every variant
      # names a feature the migrations seed; every settings combination the UI
      # can build resolves to a real price row, or is refused outright; and the
      # plan ladder holds.
      #
      # This step used to fetch KIE's live rate table and exit 1 if it could
      # not, which made a third party able to fail the build. Prices are rows in
      # `pricing.rows.json` now, so nothing here touches the network.
      - run: pnpm check:catalog

      - run: pnpm build
        env:
          # No .env in CI, and NEXT_PUBLIC_ values are inlined at build time.
          # resolveRuntime() returns a not-ready result rather than throwing on
          # an unset mode, so without this the build would succeed while
          # producing a different artifact than anyone runs.
          NEXT_PUBLIC_APP_MODE: demo

  backend:
    name: Backend — typecheck, lint, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm backend:typecheck
      - run: pnpm backend:lint
      - run: pnpm backend:test

  secrets:
    name: Secrets — full history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads commits, not the working tree. The default shallow
          # clone gives it one commit, which passes in about a second and
          # proves nothing — a key added and later removed lives in the history
          # and is exactly what this job is for.
          fetch-depth: 0

      # The container rather than the marketplace action, so this depends on
      # nothing but a public image: no action licensing, no extra token
      # permissions, and the same command that runs locally.
      #
      # --redact so a finding names the file, line and commit without printing
      # the secret into a public build log, which would publish it a second time.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest             git /repo -c /repo/.gitleaks.toml --redact --exit-code 1 --no-banner

  database:
    name: Database — migrations, integration, smoke
    runs-on: ubuntu-latest
    env:
      # migrate.ts requires this and deliberately has no default — pointing the
      # migration runner at a database by accident is exactly the mistake worth
      # making impossible. (The integration harness does default, to this same
      # URL.) The port is 5442 because that is what docker-compose.yml
      # publishes; the credentials are the compose file's local-only ones.
      DATABASE_URL: postgres://vgen:vgen-local@127.0.0.1:5442/vgen
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # docker compose, not a `services:` block. This schema needs pgvector for
      # document_chunks.embedding, pg_cron for 0008's five maintenance jobs, and
      # ICU fa-IR applied at initdb — the last of which can never be set later.
      # Only docker/postgres.Dockerfile provides all three, and `services:`
      # cannot build an image. Reusing the repo's own compose file also means CI
      # and a developer's machine are running the identical database.
      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - run: pnpm db:migrate

      # The catalog's end-to-end proof. `pnpm test` already asserts the
      # committed snapshot equals FAMILIES; this asserts the database serves
      # exactly that snapshot, and the two together mean the database serves
      # exactly FAMILIES. A seeder that dropped a control, a repository that
      # regrouped a family, or a migration that lost a column all surface here
      # as a diff — and nowhere else, because every other test reads the
      # committed file rather than the database.
      - run: pnpm catalog:publish
      - name: Seeding twice writes nothing the second time
        run: pnpm catalog:publish | grep -q 'already current'
      # The catalogue snapshot is exported further down, after the grants.
      # It used to be taken here, and cannot be any more: a variant's
      # `unlimited` marker is derived from `unlimited_entitlements` when the
      # document is built, so exporting before those rows exist produces a
      # catalogue that is missing a field the database will serve a second
      # later. See the unlimited step below.

      # Pricing, and the one check that makes moving it into Postgres safe.
      # pricing.expected.json holds every price the app charged before the rate
      # table was deleted; check:pricing recomputes all 738 of them from the
      # seeded rows. A disagreement means the migration changed what a customer
      # pays, which is never acceptable in either direction. It audits the
      # margin floor in the same pass, because matching the old number is no
      # defence if the old number was below cost.
      - run: pnpm pricing:publish
      - name: Seeding prices twice writes nothing the second time
        run: pnpm pricing:publish | grep -q 'already current'
      - run: pnpm check:pricing

      # The plan ladder, same two-part guarantee as the catalogue: a unit test
      # says the committed snapshot matches the ladder the screens render, and
      # this says the database serves that snapshot. Neither is worth much
      # alone; together they mean the table bills what the card advertises.
      - run: pnpm plans:publish
      - name: Seeding plans twice writes nothing the second time
        run: pnpm plans:publish | grep -q 'already current'
      - run: pnpm plans:snapshot
      - name: The database must serve the committed plan snapshot
        run: git diff --exit-code -- src/data/plans.snapshot.json

      # Unlimited access. Seeded last because it looks the catalogue up by
      # variant id — a grant can only point at a model that already exists, and
      # the seeder refuses rather than inventing one.
      #
      # The browser does now read a grant, indirectly. `GET /catalog` marks the
      # variants that have the free pipe, derived from these rows rather than
      # copied into `capabilities`, so that the shop and the quote can never
      # disagree about which models are free. That makes the catalogue document
      # depend on this step, which is why its snapshot is exported after it
      # rather than up beside `catalog:publish`.
      #
      # What the customer is actually *owed* still comes from the quote — the
      # marker says the pipe exists, not that it is yours today — and the
      # integration tests are what hold that.
      - run: pnpm unlimited:publish
      - name: Seeding grants twice writes nothing the second time
        run: pnpm unlimited:publish | grep -q 'already current'

      - run: pnpm catalog:snapshot
      - name: The database must serve the committed snapshot
        run: git diff --exit-code -- src/data/catalog.snapshot.json

      # Providers and routing. Like the grants above, this looks the catalogue
      # up by variant id and refuses rather than inventing a row, so it has to
      # come after catalog:publish.
      - run: pnpm providers:publish
      - name: Seeding providers twice writes nothing the second time
        run: pnpm providers:publish | grep -q 'already current'

      # Nothing this seeder writes may be switched on by writing it. Every
      # route ships inactive and re-running must never flip one, because the
      # WaveSpeed model ids it names have not been proved against a live API —
      # activating one is a person's decision, not a side effect of CI.
      - name: Every seeded route must be inactive
        run: |
          docker compose exec -T postgres psql -U vgen -d vgen -tAc "select count(*) from model_routes where is_active" | grep -qx '0'

      # The editorial content: presets, the prompt bank, skills, the featured
      # shelf, courses, examples and voices. Seeded after the catalogue because
      # every row that opens a model names a family, and the seeder refuses a
      # family no active model carries rather than writing a card that opens
      # nothing.
      - run: pnpm content:publish
      - name: Seeding content twice writes nothing the second time
        run: pnpm content:publish | grep -q 'already current'
      - run: pnpm content:snapshot
      - name: The database must serve the committed content snapshot
        run: git diff --exit-code -- src/data/content.snapshot.json

      # The publish filter used to be a `published()` helper each screen had to
      # remember to call, and a screen that forgot it showed a draft to a
      # customer. It is a WHERE clause now, and this is what says so: the served
      # snapshot must hold exactly as many items as the table holds published
      # rows. Fewer means the query drops something an admin published; more
      # means a draft reached a customer.
      - name: The served content must be exactly the published rows
        run: |
          published=$(docker compose exec -T postgres psql -U vgen -d vgen -tAc "select count(*) from content_items where status = 'published'")
          served=$(node -e "const s=require('./src/data/content.snapshot.json');console.log(Object.values(s).reduce((n,r)=>n+r.length,0))")
          echo "published=$published served=$served"
          test "$published" = "$served"

      # The community feed, and the ten fake users behind it. Seeded last of
      # the content because it names families the same way, and because it is
      # the only seeder here that creates users — every one of them carries an
      # @demo.invalid address (RFC 2606, unregisterable) so the whole set is one
      # predicate away from being deleted when real posts arrive.
      - run: pnpm community:publish
      - name: Seeding the feed twice writes nothing the second time
        run: pnpm community:publish | grep -q 'already current'
      - run: pnpm community:snapshot
      - name: The database must serve the committed feed snapshot
        run: git diff --exit-code -- src/data/community.snapshot.json

      # Every seeded author must be findable and fake. A real address here
      # would mean the seeder had written a row somebody could receive mail at.
      - name: Every seeded author must be a demo user
        run: |
          docker compose exec -T postgres psql -U vgen -d vgen -tAc "select count(*) from posts p join users u on u.id = p.author_user_id where u.email not like '%@demo.invalid'" | grep -qx '0'

      # The catalogue must be unchanged by all of the above. Both the unlimited
      # and the provider seeder add provider_models rows for other providers,
      # and if the catalogue query ever stopped excluding them every customer
      # would see Nano Banana twice.
      - run: pnpm catalog:snapshot
      - name: Serving rows must stay out of the catalogue
        run: git diff --exit-code -- src/data/catalog.snapshot.json

      # Integration tests run last, against a seeded database rather than an
      # empty one.
      #
      # They used to run immediately after the migrations, which was fine while
      # every one of them built its own fixtures. The quote tests do not: what
      # a generation costs, which plan reaches it and whether it is free are all
      # configuration, so a quote test written against invented rows would prove
      # the code works on a catalogue nobody ships. Against the seeded rows it
      # proves the shipped configuration behaves. Every test rolls back, so
      # ordering them after the seeders costs nothing.
      - run: pnpm backend:test:integration

      # The schema's own test: assertions in one transaction ending in ROLLBACK,
      # so it is safe against any database.
      - name: Schema smoke
        run: docker compose exec -T postgres psql -U vgen -d vgen -v ON_ERROR_STOP=1 < packages/db/smoke.sql

      - name: Postgres logs on failure
        if: failure()
        run: docker compose logs postgres

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The Playwright project pins `channel: "chrome"`, so it is real Chrome
      # that has to be installed, not the bundled Chromium.
      - run: pnpm exec playwright install --with-deps chrome

      # Worth its runtime: navigation.spec.ts pins deep links, back/forward and
      # the 404 -> studio redirect, which is exactly what a UI change breaks.
      # Playwright starts its own dev server on 5182 and retries twice in CI.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
