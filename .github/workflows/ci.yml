name: CI

# main is a shared branch now, so it gets checked by something other than the
# person pushing to it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the run it superseded. The last commit
  # is the only one whose result anybody acts on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck, lint, format, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm before setup-node, not after: `cache: pnpm` resolves the store path
      # by running pnpm, so it has to exist first. No version is pinned here on
      # purpose — the action reads `packageManager` from package.json, which is
      # what keeps CI and the lockfile from drifting apart.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile is the point: it fails rather than quietly resolving
      # something the lockfile does not describe.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      # Three audits in one command, and all of them offline now. Every variant
      # names a feature the migrations seed; every settings combination the UI
      # can build resolves to a real price row, or is refused outright; and the
      # plan ladder holds.
      #
      # This step used to fetch KIE's live rate table and exit 1 if it could
      # not, which made a third party able to fail the build. Prices are rows in
      # `pricing.rows.json` now, so nothing here touches the network.
      - run: pnpm check:catalog

      - run: pnpm build
        env:
          # No .env in CI, and NEXT_PUBLIC_ values are inlined at build time.
          # resolveRuntime() returns a not-ready result rather than throwing on
          # an unset mode, so without this the build would succeed while
          # producing a different artifact than anyone runs.
          NEXT_PUBLIC_APP_MODE: demo

  backend:
    name: Backend — typecheck, lint, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm backend:typecheck
      - run: pnpm backend:lint
      - run: pnpm backend:test

  database:
    name: Database — migrations, integration, smoke
    runs-on: ubuntu-latest
    env:
      # migrate.ts requires this and deliberately has no default — pointing the
      # migration runner at a database by accident is exactly the mistake worth
      # making impossible. (The integration harness does default, to this same
      # URL.) The port is 5442 because that is what docker-compose.yml
      # publishes; the credentials are the compose file's local-only ones.
      DATABASE_URL: postgres://vgen:vgen-local@127.0.0.1:5442/vgen
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # docker compose, not a `services:` block. This schema needs pgvector for
      # document_chunks.embedding, pg_cron for 0008's five maintenance jobs, and
      # ICU fa-IR applied at initdb — the last of which can never be set later.
      # Only docker/postgres.Dockerfile provides all three, and `services:`
      # cannot build an image. Reusing the repo's own compose file also means CI
      # and a developer's machine are running the identical database.
      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - run: pnpm db:migrate
      - run: pnpm backend:test:integration

      # The catalog's end-to-end proof. `pnpm test` already asserts the
      # committed snapshot equals FAMILIES; this asserts the database serves
      # exactly that snapshot, and the two together mean the database serves
      # exactly FAMILIES. A seeder that dropped a control, a repository that
      # regrouped a family, or a migration that lost a column all surface here
      # as a diff — and nowhere else, because every other test reads the
      # committed file rather than the database.
      - run: pnpm catalog:publish
      - name: Seeding twice writes nothing the second time
        run: pnpm catalog:publish | grep -q 'already current'
      - run: pnpm catalog:snapshot
      - name: The database must serve the committed snapshot
        run: git diff --exit-code -- src/data/catalog.snapshot.json

      # Pricing, and the one check that makes moving it into Postgres safe.
      # pricing.expected.json holds every price the app charged before the rate
      # table was deleted; check:pricing recomputes all 738 of them from the
      # seeded rows. A disagreement means the migration changed what a customer
      # pays, which is never acceptable in either direction. It audits the
      # margin floor in the same pass, because matching the old number is no
      # defence if the old number was below cost.
      - run: pnpm pricing:publish
      - name: Seeding prices twice writes nothing the second time
        run: pnpm pricing:publish | grep -q 'already current'
      - run: pnpm check:pricing

      # The schema's own test: assertions in one transaction ending in ROLLBACK,
      # so it is safe against any database.
      - name: Schema smoke
        run: docker compose exec -T postgres psql -U vgen -d vgen -v ON_ERROR_STOP=1 < packages/db/smoke.sql

      - name: Postgres logs on failure
        if: failure()
        run: docker compose logs postgres

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The Playwright project pins `channel: "chrome"`, so it is real Chrome
      # that has to be installed, not the bundled Chromium.
      - run: pnpm exec playwright install --with-deps chrome

      # Worth its runtime: navigation.spec.ts pins deep links, back/forward and
      # the 404 -> studio redirect, which is exactly what a UI change breaks.
      # Playwright starts its own dev server on 5182 and retries twice in CI.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
