name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # False, matching GitHub's own Pages starter workflow. The group covers both
  # jobs, so cancelling in progress can kill a live actions/deploy-pages run and
  # leave the environment pointing at a half-published artifact — with a
  # green-looking newer run right behind it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `build` runs typecheck first, which now covers scripts/ as well as src/.
      # The pricing audits are deliberately NOT a deploy gate: they call KIE's
      # live rate endpoint, and a flaky third-party network should not be able to
      # block a deploy. Run them with `npm run check` before shipping a pricing
      # change instead.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
