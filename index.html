<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Vgen</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Fonts are bundled (src/fonts.css). Nothing is fetched from Google at
         runtime: it is slow from Iran, and a blocked stylesheet dropped the whole
         UI to a system font part-way through loading. -->
    <style>html, body { background: #0a0a0b; }</style>
    <!-- Start the DNS+TCP+TLS chain for the runtime third-party origins during
         parse instead of serially after it. On a high-latency connection the
         handshakes, not the bytes, are the expensive part. -->
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <link rel="preconnect" href="https://api.kie.ai" crossorigin />
    <link rel="preconnect" href="https://file.aiquickdraw.com" crossorigin />
    <!-- `defer` is not a micro-optimisation here. Without it this is a
         synchronous script in <head>, so the parser cannot reach the module
         below until it resolves — and telegram.org is filtered in Iran, where a
         blocked connection typically hangs rather than resets. That is the whole
         app held on a bare background for the OS TCP timeout. main.tsx already
         treats window.Telegram as optional, and deferred scripts still run in
         document order, so this costs nothing when the SDK does load. -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
